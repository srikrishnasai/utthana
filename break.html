<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Break time</title>
  <link rel="icon" href="icons/icon48.png">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #172230; color: #EEF2F0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 540px; padding: 24px 22px; text-align: center; }
    .stage { position: relative; width: min(260px, 36vh); height: min(260px, 36vh); margin: 0 auto clamp(18px, 4vh, 36px); }
    .ring { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(238,242,240,0.18); }
    .orb {
      position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #4FA392 0%, #2F7D6D 55%, #24635A 100%);
      transform: scale(0.62);
      transition: transform 4s ease-in-out;
    }
    .orb.big { transform: scale(1); }
    .orb.small { transform: scale(0.42); }
    .center {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .center.emoji { font-size: clamp(44px, 9vh, 64px); }
    .kicker { font-size: 14px; color: rgba(238,242,240,0.6); margin: 0 0 10px; }
    h1 {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-weight: 600; font-size: clamp(28px, 7vw, 38px); line-height: 1.12; margin: 0 0 12px;
    }
    p { margin: 0 auto; max-width: 42ch; font-size: 16px; line-height: 1.55; color: rgba(238,242,240,0.74); }
    .steps { display: flex; gap: 6px; justify-content: center; margin: 26px auto 0; }
    .steps span { width: 28px; height: 4px; border-radius: 2px; background: rgba(238,242,240,0.15); }
    .steps span.done { background: #C9892B; }
    .steps span.now { background: #EEF2F0; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
    button {
      font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
      padding: 13px 20px; border-radius: 12px; border: 1.5px solid transparent;
    }
    button:focus-visible { outline: 3px solid #C9892B; outline-offset: 2px; }
    .primary { background: #EEF2F0; color: #172230; }
    .primary:hover { background: #FFFFFF; }
    .quiet { background: transparent; color: #EEF2F0; border-color: rgba(238,242,240,0.35); }
    .quiet:hover { border-color: #EEF2F0; }
    .link { background: transparent; color: rgba(238,242,240,0.6); padding: 13px 10px; }
    .link:hover { color: #EEF2F0; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      .orb, .orb.big, .orb.small { transition: none; transform: scale(0.7); }
    }
  </style>
</head>
<body>
  <main>
    <div class="stage" aria-hidden="true">
      <div class="ring"></div>
      <div class="orb" id="orb"></div>
      <div class="center emoji" id="center"></div>
    </div>

    <section id="intro">
      <p class="kicker" id="introKicker">Break time</p>
      <h1 id="title"></h1>
      <p id="introText"></p>
      <div class="actions">
        <button class="primary" id="start">Start</button>
        <button class="quiet" id="swap">Something else</button>
        <button class="link" id="snooze" hidden>Remind me in 10 min</button>
        <button class="link" id="skip">Not now</button>
      </div>
    </section>

    <section id="running" hidden>
      <h1 id="phase" aria-live="polite"></h1>
      <p id="hint"></p>
      <div class="actions" id="confirmWrap" hidden>
        <button class="primary" id="confirm"></button>
      </div>
      <div class="steps" id="steps" aria-hidden="true"></div>
    </section>

    <section id="done" hidden>
      <p class="kicker" id="doneKicker">Break done</p>
      <h1>Nice work.</h1>
      <p id="doneText"></p>
      <div class="actions">
        <button class="primary" id="back">Back to work</button>
        <button class="quiet" id="another">One more break</button>
      </div>
    </section>
  </main>
  <script src="activities.js"></script>
  <script src="break.js"></script>
</body>
</html>
