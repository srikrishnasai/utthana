<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your workday · Utthana</title>
  <link rel="icon" href="icons/icon48.png">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #172230; color: #EEF2F0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: 100%; max-width: 520px; padding: 28px 24px; }
    .kicker { font-size: 14px; color: rgba(238,242,240,0.6); margin: 0 0 8px; }
    h1 {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-weight: 600; font-size: clamp(28px, 7vw, 38px); line-height: 1.12; margin: 0 0 22px;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tile { background: rgba(238,242,240,0.07); border-radius: 14px; padding: 14px 16px; }
    .tile .n {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums;
    }
    .tile .l { font-size: 13px; color: rgba(238,242,240,0.65); margin-top: 4px; }
    .note { margin: 22px 0 0; font-size: 16px; line-height: 1.55; color: rgba(238,242,240,0.8); }
    .sub { font-size: 13px; font-weight: 600; color: rgba(238,242,240,0.6); margin: 26px 0 6px; }
    .timeline { border-top: 1px solid rgba(238,242,240,0.12); max-height: 260px; overflow-y: auto; }
    .trow {
      display: flex; align-items: baseline; gap: 14px; padding: 7px 2px;
      border-bottom: 1px solid rgba(238,242,240,0.08); font-size: 14px;
    }
    .trow .ttime { flex: none; width: 112px; color: rgba(238,242,240,0.55); font-variant-numeric: tabular-nums; }
    .trow .tlabel { color: rgba(238,242,240,0.9); }
    .trow.mark .tlabel { color: #C9892B; }
    .tempty { font-size: 14px; color: rgba(238,242,240,0.55); padding: 8px 2px; margin: 0; }
    .actions { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
      padding: 13px 20px; border-radius: 12px; border: 1.5px solid transparent;
    }
    button:focus-visible { outline: 3px solid #C9892B; outline-offset: 2px; }
    .primary { background: #EEF2F0; color: #172230; }
    .quiet { background: transparent; color: #EEF2F0; border-color: rgba(238,242,240,0.35); }
  </style>
</head>
<body>
  <main>
    <p class="kicker" id="kicker">Workday wrap-up</p>
    <h1>Here's how today went.</h1>
    <div class="grid">
      <div class="tile"><div class="n" id="screen">0m</div><div class="l">at the screen</div></div>
      <div class="tile"><div class="n" id="breaks">0</div><div class="l">breaks taken</div></div>
      <div class="tile"><div class="n" id="longest">0m</div><div class="l">longest stretch without a break</div></div>
      <div class="tile"><div class="n" id="water">0</div><div class="l">glasses of water</div></div>
    </div>
    <p class="note" id="note"></p>
    <p class="sub">Today's timeline</p>
    <div class="timeline" id="timeline"></div>
    <div class="actions">
      <button class="primary" id="done">Log off for the day</button>
      <button class="quiet" id="keep">I'm still working</button>
    </div>
  </main>
  <script src="summary.js"></script>
</body>
</html>
